name: Import zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo contents with zip
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          mkdir /tmp/unz
          unzip -q "$ZIP" -d /tmp/unz
          SRC=$(find /tmp/unz -maxdepth 1 -mindepth 1 -type d | head -1)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.github' "$SRC"/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace with improved version"
          git push
